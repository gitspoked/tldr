[project]
name = "tldreadme"
version = "0.1.3"
description = "Local-first repository reconnaissance, code navigation, planning, and verification through CLI and MCP interfaces."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Matt Klein", email = "247545230+gitspoked@users.noreply.github.com" },
]
dependencies = [
    "tree-sitter==0.21.3",
    "tree-sitter-languages==1.10.2",
    "qdrant-client>=1.9",
    "falkordb>=1.0",
    "redis>=5.0",
    "watchdog>=4.0",
    "mcp>=1.0",
    "click>=8.1",
    "questionary>=2.0,<3",
    "rich>=13.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.0,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
tldr = "tldreadme.cli:main"

[project.urls]
Homepage = "https://github.com/gitspoked/tldr"
Issues = "https://github.com/gitspoked/tldr/issues"
Repository = "https://github.com/gitspoked/tldr"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bedrock: critical contract and compatibility tests that gate the bedrock layer",
]
filterwarnings = [
    "ignore:Language\\(path, name\\) is deprecated\\. Use Language\\(ptr, name\\) instead\\.:FutureWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["tldreadme"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
